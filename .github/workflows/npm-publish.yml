name: npm Publish

on:
  release:
    types: [published]
  # Manual fallback: release.yml creates the GitHub Release using the default
  # GITHUB_TOKEN, and GitHub does not let GITHUB_TOKEN-authored events trigger
  # other workflows (anti-recursion protection) — so "release: published"
  # above never actually fires. Until release.yml is updated to create the
  # release with a PAT instead, run this manually after each release.
  #
  # workflow_dispatch is only usable against a ref where the workflow file
  # itself already declares this trigger, so the release tag (created before
  # this fallback existed, and every future tag, which is cut before this
  # workflow can be edited from it) can't be used directly as the dispatch
  # ref. Run this from the default branch instead and pass the version input.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 2.7.0, no "v" prefix)'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish-platform-packages:
    name: Publish ${{ matrix.suffix }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include:
          - suffix: darwin-arm64
            goos: darwin
            goarch: arm64
          - suffix: darwin-x64
            goos: darwin
            goarch: amd64
          - suffix: linux-x64
            goos: linux
            goarch: amd64
          - suffix: linux-arm64
            goos: linux
            goarch: arm64
          - suffix: win32-x64
            goos: windows
            goarch: amd64
            ext: .exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.23.x'
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version from tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p npm/platforms/${{ matrix.suffix }}/bin
          go build -ldflags="-s -w" -o npm/platforms/${{ matrix.suffix }}/bin/docxgo${{ matrix.ext }} ./cmd/docxgo/

      - name: Generate platform package.json
        run: |
          cat > npm/platforms/${{ matrix.suffix }}/package.json << EOF
          {
            "name": "@mmonterroca/docxgo-${{ matrix.suffix }}",
            "version": "${{ steps.version.outputs.version }}",
            "description": "docxgo binary for ${{ matrix.suffix }}",
            "os": ["${{ matrix.goos == 'windows' && 'win32' || matrix.goos }}"],
            "cpu": ["${{ matrix.goarch == 'amd64' && 'x64' || matrix.goarch }}"],
            "main": "",
            "files": ["bin/", "README.md"],
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "https://github.com/mmonterroca/docxgo.git",
              "directory": "npm/platforms/${{ matrix.suffix }}"
            }
          }
          EOF

      - name: Generate platform README
        run: |
          cat > npm/platforms/${{ matrix.suffix }}/README.md << EOF
          # @mmonterroca/docxgo-${{ matrix.suffix }}

          Platform-specific \`docxgo\` binary for ${{ matrix.suffix }} (${{ matrix.goos }}/${{ matrix.goarch }}).

          Don't install this package directly — it's installed automatically as an
          \`optionalDependency\` of [\`@mmonterroca/docxgo\`](https://www.npmjs.com/package/@mmonterroca/docxgo),
          which resolves the right platform package for you. See that package for
          documentation, usage, and the CLI/JSON-RPC protocol reference.
          EOF

      - name: Publish platform package (provenance)
        run: |
          cd npm/platforms/${{ matrix.suffix }}
          PKG="@mmonterroca/docxgo-${{ matrix.suffix }}@${{ steps.version.outputs.version }}"
          if npm view "$PKG" version >/dev/null 2>&1; then
            echo "$PKG already published, skipping (safe re-run)"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-main-package:
    name: Publish @mmonterroca/docxgo
    needs: publish-platform-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version from tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: cd npm && npm ci

      - name: Build
        run: cd npm && npm run build

      - name: Set version
        run: cd npm && npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Update optionalDependencies versions
        run: |
          cd npm
          node -e "
            const pkg = require('./package.json');
            const v = '${{ steps.version.outputs.version }}';
            for (const key in pkg.optionalDependencies) {
              pkg.optionalDependencies[key] = v;
            }
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Publish (provenance)
        run: |
          cd npm
          PKG="@mmonterroca/docxgo@${{ steps.version.outputs.version }}"
          if npm view "$PKG" version >/dev/null 2>&1; then
            echo "$PKG already published, skipping (safe re-run)"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  notify-on-failure:
    name: Notify on publish failure
    needs: [publish-platform-packages, publish-main-package]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update a tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The npm publish workflow failed for \`${context.ref}\`.`,
              '',
              `Run: ${runUrl}`,
              '',
              'Common cause: the `NPM_TOKEN` repo secret has expired (granular access ' +
                'tokens require an expiration) or lacks permission. Rotate it at ' +
                'https://www.npmjs.com/settings/mmonterroca/tokens and update the repo secret, ' +
                'then re-run the failed jobs from the run above.',
            ].join('\n');

            const label = 'npm-publish-failure';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Failed again:\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `npm publish failed for ${context.ref}`,
                body,
                labels: [label],
              });
            }
