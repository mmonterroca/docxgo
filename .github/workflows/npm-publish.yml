name: npm Publish

on:
  # release.yml invokes this workflow directly as a job (see its publish-npm
  # job), passing the version explicitly. There is deliberately no `release:
  # types: [published]` trigger here: that event only fires for a real-PAT
  # (non-bot) authored release, and release.yml's publish-npm job always runs
  # regardless of RELEASE_PAT — keeping both would fire this workflow twice
  # for the same tag once RELEASE_PAT is configured, racing two `npm publish`
  # calls against the same version.
  workflow_call:
    inputs:
      version:
        description: 'Version to publish (e.g. 2.7.2, no "v" prefix)'
        required: true
        type: string
  # Idempotent manual fallback, usable from the default branch if a release
  # ever needs to be re-published by hand.
  #
  # workflow_dispatch is only usable against a ref where the workflow file
  # itself already declares this trigger, so the release tag (created before
  # this fallback existed, and every future tag, which is cut before this
  # workflow can be edited from it) can't be used directly as the dispatch
  # ref. Run this from the default branch and pass the version input; the jobs
  # below still check out the matching vX.Y.Z tag before building.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 2.7.2, no "v" prefix)'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish-platform-packages:
    name: Publish ${{ matrix.suffix }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include:
          - suffix: darwin-arm64
            goos: darwin
            goarch: arm64
          - suffix: darwin-x64
            goos: darwin
            goarch: amd64
          - suffix: linux-x64
            goos: linux
            goarch: amd64
          - suffix: linux-arm64
            goos: linux
            goarch: arm64
          - suffix: win32-x64
            goos: windows
            goarch: amd64
            ext: .exe

    steps:
      # Validated before checkout uses it as a ref and before any run: step
      # interpolates it: inputs.version only ever reaches this job from a
      # human typing into workflow_dispatch (workflow_call always passes a
      # tag-derived version), but a malformed value here would otherwise
      # produce a confusing "ref not found" from checkout below.
      - name: Validate version input
        if: inputs.version != ''
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version input '$INPUT_VERSION' must be a bare semantic version like 2.9.0 (no 'v' prefix, no other characters)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version != '' && format('refs/tags/v{0}', inputs.version) || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version from tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p npm/platforms/${{ matrix.suffix }}/bin
          go build -ldflags="-s -w" -o npm/platforms/${{ matrix.suffix }}/bin/docxgo${{ matrix.ext }} ./cmd/docxgo/

      - name: Generate platform package.json
        run: |
          cat > npm/platforms/${{ matrix.suffix }}/package.json << EOF
          {
            "name": "@mmonterroca/docxgo-${{ matrix.suffix }}",
            "version": "${{ steps.version.outputs.version }}",
            "description": "docxgo binary for ${{ matrix.suffix }}",
            "os": ["${{ matrix.goos == 'windows' && 'win32' || matrix.goos }}"],
            "cpu": ["${{ matrix.goarch == 'amd64' && 'x64' || matrix.goarch }}"],
            "main": "",
            "files": ["bin/", "README.md", "LICENSE"],
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "https://github.com/mmonterroca/docxgo.git",
              "directory": "npm/platforms/${{ matrix.suffix }}"
            }
          }
          EOF

      - name: Copy license into platform package
        run: cp LICENSE npm/platforms/${{ matrix.suffix }}/LICENSE

      - name: Generate platform README
        run: |
          cat > npm/platforms/${{ matrix.suffix }}/README.md << EOF
          # @mmonterroca/docxgo-${{ matrix.suffix }}

          Platform-specific \`docxgo\` binary for ${{ matrix.suffix }} (${{ matrix.goos }}/${{ matrix.goarch }}).

          Don't install this package directly — it's installed automatically as an
          \`optionalDependency\` of [\`@mmonterroca/docxgo\`](https://www.npmjs.com/package/@mmonterroca/docxgo),
          which resolves the right platform package for you. See that package for
          documentation, usage, and the CLI/JSON-RPC protocol reference.
          EOF

      - name: Publish platform package (provenance)
        run: |
          cd npm/platforms/${{ matrix.suffix }}
          PKG="@mmonterroca/docxgo-${{ matrix.suffix }}@${{ steps.version.outputs.version }}"
          if npm view "$PKG" version >/dev/null 2>&1; then
            echo "$PKG already published, skipping (safe re-run)"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-main-package:
    name: Publish @mmonterroca/docxgo
    needs: publish-platform-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version != '' && format('refs/tags/v{0}', inputs.version) || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version from tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      # Platform packages are published by the prerequisite job. Refresh the
      # lock metadata now so a release version that did not exist when the tag
      # was cut is present before npm ci performs its strict sync check.
      - name: Sync published platform dependencies
        run: cd npm && npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: cd npm && npm ci

      - name: Build
        run: cd npm && npm run build

      - name: Set version
        run: cd npm && npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Update optionalDependencies versions
        run: |
          cd npm
          node -e "
            const pkg = require('./package.json');
            const v = '${{ steps.version.outputs.version }}';
            for (const key in pkg.optionalDependencies) {
              pkg.optionalDependencies[key] = v;
            }
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Publish (provenance)
        run: |
          cd npm
          PKG="@mmonterroca/docxgo@${{ steps.version.outputs.version }}"
          if npm view "$PKG" version >/dev/null 2>&1; then
            echo "$PKG already published, skipping (safe re-run)"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  notify-on-failure:
    name: Notify on publish failure
    needs: [publish-platform-packages, publish-main-package]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update a tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The npm publish workflow failed for \`${context.ref}\`.`,
              '',
              `Run: ${runUrl}`,
              '',
              'Common cause: the `NPM_TOKEN` repo secret has expired (granular access ' +
                'tokens require an expiration) or lacks permission. Rotate it at ' +
                'https://www.npmjs.com/settings/mmonterroca/tokens and update the repo secret, ' +
                'then re-run the failed jobs from the run above.',
            ].join('\n');

            const label = 'npm-publish-failure';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Failed again:\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `npm publish failed for ${context.ref}`,
                body,
                labels: [label],
              });
            }
