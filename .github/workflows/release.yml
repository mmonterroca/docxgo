name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-x64
          - goos: linux
            goarch: amd64
            suffix: linux-x64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: windows
            goarch: amd64
            suffix: win32-x64
            ext: .exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.23.x'
          cache: false

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/docxgo${{ matrix.ext }} ./cmd/docxgo/

      - name: Package archive
        run: |
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip ../docxgo-${{ matrix.suffix }}.zip docxgo${{ matrix.ext }}
          else
            tar czf ../docxgo-${{ matrix.suffix }}.tar.gz docxgo${{ matrix.ext }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docxgo-${{ matrix.suffix }}
          path: docxgo-${{ matrix.suffix }}.*

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.23.x'
          cache: false

      - name: Run tests
        run: go test -v -count=1 ./...

  release:
    name: Create GitHub Release
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'rc') }}
          generate_release_notes: true
          files: release-assets/*
        env:
          # Must be a real PAT (repo-scoped "Contents: Read and write" is
          # enough), not the default GITHUB_TOKEN: GitHub does not let events
          # created by GITHUB_TOKEN trigger other workflows (anti-recursion
          # protection), so npm-publish.yml's "release: published" trigger
          # would never fire if this stayed as GITHUB_TOKEN. See
          # npm-publish.yml's workflow_dispatch fallback for the manual path
          # this replaces.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
