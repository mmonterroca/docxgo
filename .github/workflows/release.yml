name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-x64
          - goos: linux
            goarch: amd64
            suffix: linux-x64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: windows
            goarch: amd64
            suffix: win32-x64
            ext: .exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache: false

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/docxgo${{ matrix.ext }} ./cmd/docxgo/
          cp LICENSE dist/LICENSE

      - name: Package archive
        run: |
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip ../docxgo-${{ matrix.suffix }}.zip docxgo${{ matrix.ext }} LICENSE
          else
            tar czf ../docxgo-${{ matrix.suffix }}.tar.gz docxgo${{ matrix.ext }} LICENSE
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docxgo-${{ matrix.suffix }}
          path: docxgo-${{ matrix.suffix }}.*

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache: false

      - name: Run tests
        run: go test -v -count=1 ./...

  release:
    name: Create GitHub Release
    needs: [build, test]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Check RELEASE_PAT is configured
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "$RELEASE_PAT" ]; then
            echo "::warning::RELEASE_PAT is empty or missing — this release will be authored by github-actions[bot] instead of a real user. This is now cosmetic: the publish-npm job below invokes npm-publish.yml directly and no longer depends on the 'release: published' event that a bot-authored release can't fire. Still worth fixing so releases show a real author."
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'rc') }}
          generate_release_notes: true
          files: release-assets/*
          # softprops/action-gh-release's `token` input defaults to
          # `${{ github.token }}` in its own action.yml, and that default is
          # resolved by the Actions runtime before the action ever runs — so
          # the action always sees a non-empty token input regardless of any
          # env var we set on this step. Passing RELEASE_PAT via `env:
          # GITHUB_TOKEN` (the previous approach) was silently ignored; it
          # must be passed as this `with: token:` input to actually override
          # the default. An empty RELEASE_PAT is treated by the action as
          # unset and falls back to `github.token` — same degrade-to-bot-
          # author behavior as before, just via the mechanism that actually
          # works. No longer load-bearing for npm publishing either way: the
          # publish-npm job below calls npm-publish.yml directly instead of
          # relying on the "release: published" event, which a
          # GITHUB_TOKEN-authored release can't fire (GitHub's anti-recursion
          # protection).
          token: ${{ secrets.RELEASE_PAT }}

  publish-npm:
    name: Publish to npm
    needs: release
    permissions:
      contents: read
      id-token: write
      issues: write
    uses: ./.github/workflows/npm-publish.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
