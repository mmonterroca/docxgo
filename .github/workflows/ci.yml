name: CI

permissions:
  contents: read

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  lint-and-test:
    name: Lint, Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23.x'
          cache: false  # No external dependencies, so no need to cache

      - name: Check out code
        uses: actions/checkout@v4

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          args: --timeout=5m
          only-new-issues: ${{ github.event_name == 'pull_request' }}

      - name: Get dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Run tests
        run: go test -v ./...

      - name: Test examples
        run: |
          cd examples
          chmod +x test_all.sh
          ./test_all.sh

  npm-test:
    name: Node.js Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.23.x'
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Go binary
        run: go build -o npm/bin/docxgo ./cmd/docxgo/

      - name: Install npm dependencies
        run: cd npm && npm ci

      - name: Run Node.js tests
        run: cd npm && npx tsx --test src/__tests__/*.test.ts
